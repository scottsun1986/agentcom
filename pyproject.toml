[project]
name = "agentcom"
version = "1.0.0"
description = "AgentCom — Enterprise & Government Office Management Platform with RuoYi RBAC, OpenAPI + MCP 2.2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "redis[hiredis]>=5.0.0",
    "mcp>=1.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
